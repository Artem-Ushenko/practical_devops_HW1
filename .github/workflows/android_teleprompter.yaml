name: Android Teleprompter

on:
  push:
    paths:
      - "teleprompter-app/**"
      - ".github/workflows/android_teleprompter.yaml"
  pull_request:
    paths:
      - "teleprompter-app/**"
      - ".github/workflows/android_teleprompter.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teleprompter-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-debug-apk
          path: teleprompter-app/app/build/outputs/apk/debug/*.apk
